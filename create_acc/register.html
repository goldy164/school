<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | منصة Vigito للتقييم</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <!-- Server Status Indicator -->
    <div class="top-server-status">
        <div class="status-dot-large" id="statusDot"></div>
        <div class="status-info">
            <span class="status-label">حالة السيرفر</span>
            <span class="status-state" id="statusText">جاري الفحص...</span>
        </div>
    </div>

    <canvas id="bgCanvas"></canvas>

    <div class="card-wrapper">
        <div class="auth-container">
            <div class="brand-header">
                <div class="brand-logo">V</div>
                <h1 class="brand-title">منصة Vigito للتقييم</h1>
                <p class="brand-subtitle">أنشئ حسابك واستعد للتقييم والتميز</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <!-- Role Selector -->
                <div class="form-group">
                    <label class="form-label">نوع الحساب (الصلاحية)</label>
                    <div class="role-selector">
                        <div class="role-option selected" onclick="selectRole(this, 'student')">🎓 طالب</div>
                        <div class="role-option disabled" onclick="showDisabledToast('حسابات المعلمين')">
                            👨‍🏫 معلم
                            <span class="badge">(قريباً...)</span>
                        </div>
                        <div class="role-option disabled" onclick="showDisabledToast('حسابات المسؤولين')">
                            🛡️ مسؤول
                            <span class="badge">(قريباً...)</span>
                        </div>
                    </div>
                    <input type="hidden" id="selectedRole" value="student">
                </div>

                <!-- 3 Name Fields -->
                <div class="form-group">
                    <label class="form-label">الاسم الكامل (3 خانات)</label>
                    <div class="grid-3">
                        <input type="text" class="form-input" id="regFirstName" placeholder="الأول" required>
                        <input type="text" class="form-input" id="regMiddleName" placeholder="الأب" required>
                        <input type="text" class="form-input" id="regLastName" placeholder="العائلة" required>
                    </div>
                </div>

                <!-- Grade & Class Section -->
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">الصف الدراسي</label>
                        <select class="form-select" id="regGrade" required>
                            <option value="" disabled selected>اختر الصف...</option>
                            <optgroup label="الابتدائي">
                                <option value="G1">G1 - الأول الابتدائي</option>
                                <option value="G2">G2 - الثاني الابتدائي</option>
                                <option value="G3">G3 - الثالث الابتدائي</option>
                                <option value="G4">G4 - الرابع الابتدائي</option>
                                <option value="G5">G5 - الخامس الابتدائي</option>
                                <option value="G6">G6 - السادس الابتدائي</option>
                            </optgroup>
                            <optgroup label="الإعدادي">
                                <option value="Prep 1">Prep 1 - الأول الإعدادي</option>
                                <option value="Prep 2">Prep 2 - الثاني الإعدادي</option>
                                <option value="Prep 3">Prep 3 - الثالث الإعدادي</option>
                            </optgroup>
                            <optgroup label="الثانوي">
                                <option value="S1">S1 - الأول الثانوي</option>
                                <option value="S2">S2 - الثاني الثانوي</option>
                                <option value="S3">S3 - الثالث الثانوي</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">نوع الفصل</label>
                        <select class="form-select" id="regSection" required>
                            <option value="" disabled selected>اختر الفصل...</option>
                            <option value="A">الفصل A</option>
                            <option value="B">الفصل B</option>
                            <option value="C">الفصل C</option>
                            <option value="D">الفصل D</option>
                        </select>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-input" id="regPassword" placeholder="كلمة مرور قوية..." oninput="checkStrength(this.value)" required>
                        <button type="button" class="toggle-pwd" onclick="togglePassword('regPassword', this)">إظهار</button>
                    </div>
                    <div class="strength-meter" id="strengthMeter">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnRegSubmit">إنشاء الحساب ✨</button>
            </form>

            <div class="redirect-link">
                لديك حساب بالفعل؟ <a href="../index.html">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    // Particles Background Logic
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];

    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    class Particle {
        constructor() {
            this.x = Math.random() * width; this.y = Math.random() * height;
            this.radius = Math.random() * 2 + 1;
            this.vx = (Math.random() - 0.5) * 1; this.vy = (Math.random() - 0.5) * 1;
            this.color = ['#00f2fe', '#6100ff'][Math.floor(Math.random() * 2)];
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color; ctx.fill();
        }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => p.update());
        requestAnimationFrame(animate);
    }
    animate();

    const API_URL = 'https://vigito.pythonanywhere.com';

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch(`${API_URL}/`);
            if (res.ok) {
                document.getElementById('statusDot').className = 'status-dot-large online';
                document.getElementById('statusText').className = 'status-state online';
                document.getElementById('statusText').textContent = 'ONLINE';
            } else throw new Error();
        } catch {
            document.getElementById('statusDot').className = 'status-dot-large offline';
            document.getElementById('statusText').className = 'status-state offline';
            document.getElementById('statusText').textContent = 'OFFLINE';
        }
    });

    function selectRole(element, role) {
        if (element.classList.contains('disabled')) return;
        document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        document.getElementById('selectedRole').value = role;
    }

    function showDisabledToast(roleName) {
        showToast(`التسجيل في ${roleName} غير متاح حالياً (قريباً...)`, 'error');
    }

    function togglePassword(id, btn) {
        const input = document.getElementById(id);
        if (input.type === 'password') { input.type = 'text'; btn.textContent = 'إخفاء'; }
        else { input.type = 'password'; btn.textContent = 'إظهار'; }
    }

    function checkStrength(password) {
        const meter = document.getElementById('strengthMeter');
        const bar = document.getElementById('strengthBar');
        if (!password) { meter.style.display = 'none'; return; }
        meter.style.display = 'block';
        let score = 0;
        if (password.length >= 6) score += 33;
        if (password.match(/[A-Z]/) || password.match(/[0-9]/)) score += 33;
        if (password.length >= 10 && password.match(/[^a-zA-Z0-9]/)) score += 34;
        bar.style.width = score + '%';
        if (score <= 33) bar.style.backgroundColor = '#ef4444';
        else if (score <= 66) bar.style.backgroundColor = '#f59e0b';
        else bar.style.backgroundColor = '#10b981';
    }

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg; t.className = `toast ${type}`; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 4000);
    }

    // handleRegister
    async function handleRegister(e) {
        e.preventDefault();
        const btn = document.getElementById('btnRegSubmit');
        btn.disabled = true;
        btn.textContent = 'جاري التوصيل بالسيرفر...';

        const payload = {
            firstName: document.getElementById('regFirstName').value.trim(),
            middleName: document.getElementById('regMiddleName').value.trim(),
            lastName: document.getElementById('regLastName').value.trim(),
            role: document.getElementById('selectedRole').value,
            grade: document.getElementById('regGrade').value,
            section: document.getElementById('regSection').value,
            password: document.getElementById('regPassword').value
        };

        try {
            const response = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showToast(data.message, 'success');
                // توجيه الطالب لصفحة تسجيل الدخول ومعه الـ username ليدخل به
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 2500);
            } else {
                showToast(data.message || 'حدث خطأ أثناء إنشاء الحساب', 'error');
            }
        } catch (err) {
            showToast('تعذر الاتصال بالسيرفر! حاول مرة أخرى', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'إنشاء الحساب ✨';
        }
    }
</script>
