<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - شات أولى إعدادي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>تسجيل الدخول للشات 🚀</h2>
            
            <div class="input-group">
                <input type="text" id="username-input" placeholder="اسم المستخدم" autocomplete="off">
                <span class="input-icon">👤</span>
            </div>

            <div class="input-group password-group">
                <input type="password" id="password-input" placeholder="كلمة المرور">
                <button type="button" id="toggle-password" class="toggle-pass-btn">إظهار</button>
                <span class="input-icon">🔒</span>
            </div>

            <button id="login-btn" onclick="handleLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <script>
        // كود زرار إظهار/إخفاء كلمة المرور
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password-input');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleBtn.textContent = 'إخفاء';
                } else {
                    passwordInput.type = 'password';
                    toggleBtn.textContent = 'إظهار';
                }
            });
        }

        // دالة تسجيل الدخول
        async function handleLogin() {
            const inputUser = document.getElementById("username-input").value.trim();
            const inputPass = passwordInput.value.trim();

            if (!inputUser || !inputPass) {
                alert("الرجاء إدخال اسم المستخدم وكلمة المرور!");
                return;
            }

            try {
                const response = await fetch('https://VigitoSon.pythonanywhere.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: inputUser, password: inputPass })
                });
                
                const data = await response.json();

                if (response.ok) {
                    // حفظ اسم المستخدم في الـ localStorage عشان صفحة الشات تقراه
                    localStorage.setItem("chat_username", inputUser);
                    // الانتقال لصفحة المحادثة
                    window.location.href = "chat.html";
                } else {
                    alert(data.message || "فشل تسجيل الدخول!");
                }
            } catch (err) {
                alert("حدث خطأ في الاتصال بالسيرفر!");
            }
        }
    </script>
</body>
</html>
