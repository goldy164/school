<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات أولى إعدادي - المباشر</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: #f8fafc; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        
        header { 
            background: rgba(30, 41, 59, 0.9); 
            backdrop-filter: blur(10px);
            padding: 15px; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        
        /* شاشة تسجيل الدخول */
        #login-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            flex: 1; 
            gap: 15px; 
            animation: fadeIn 0.5s ease-in-out;
        }
        #login-screen h2 { color: #38bdf8; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        #login-screen input { 
            padding: 14px; 
            font-size: 16px; 
            border-radius: 12px; 
            border: 1px solid #475569; 
            background: rgba(30, 41, 59, 0.8); 
            color: white; 
            width: 300px; 
            text-align: center; 
            outline: none; 
            transition: all 0.3s;
        }
        #login-screen input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        #login-screen button { 
            padding: 14px 30px; 
            background: linear-gradient(135deg, #0ea5e9, #2563eb); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        #login-screen button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.6); }

        /* شاشة الشات */
        #chat-screen { display: none; flex-direction: column; flex: 1; max-width: 850px; width: 100%; margin: 0 auto; overflow: hidden; position: relative; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        #load-more-btn { 
            background: rgba(51, 65, 85, 0.8); 
            color: #cbd5e1; 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 18px; 
            border-radius: 20px; 
            font-size: 13px; 
            cursor: pointer; 
            align-self: center; 
            margin-bottom: 10px; 
            display: none; 
            transition: background 0.2s;
        }
        #load-more-btn:hover { background: #475569; }

        /* التصميم الأساسي للرسائل */
        .message { 
            padding: 12px 16px; 
            border-radius: 14px; 
            max-width: 75%; 
            word-break: break-word; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease-out;
        }

        /* 1. رسائلك أنت (لون أزرق سماوي متدرج مميز) */
        .message.mine { 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            color: white;
            align-self: flex-start; 
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .message.mine .user { color: #e0f2fe; }

        /* 2. رسائل كتبها الناس الآخرون (لون مختلف تماماً: رمادي غامق أنيق مع حدود بنفسجية خفيفة) */
        .message:not(.mine) {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #f1f5f9;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(168, 85, 247, 0.3); /* حدود بنفسجية مميزة */
        }
        .message:not(.mine) .user { color: #c084fc; } /* اسم المستخدم بلون بنفسجى فاتح وواضح */

        .message .user { font-size: 12px; margin-bottom: 4px; font-weight: bold; }
        
        /* زر النزول للأسفل العائم */
        #scroll-down-btn { 
            position: absolute; 
            bottom: 85px; 
            left: 20px; 
            background: #0ea5e9; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            font-size: 18px; 
            cursor: pointer; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4); 
            transition: transform 0.2s;
        }
        #scroll-down-btn:hover { transform: scale(1.1); }
        
        /* صندوق الإرسال */
        #input-box { 
            display: flex; 
            padding: 15px; 
            background: rgba(30, 41, 59, 0.9); 
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1); 
            gap: 12px; 
        }
        #input-box input { 
            flex: 1; 
            padding: 14px; 
            border-radius: 12px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white; 
            font-size: 16px; 
            outline: none; 
            transition: border-color 0.3s;
        }
        #input-box input:focus { border-color: #22c55e; }
        #input-box button { 
            padding: 14px 25px; 
            background: linear-gradient(135deg, #16a34a, #22c55e); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #input-box button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(34, 197, 94, 0.5); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>💬 شات أولى إعدادي - المباشر</header>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <h2>تسجيل الدخول للشات</h2>
        <input type="text" id="username-input" placeholder="اسمك (مثل: احمد أو محمد)...">
        <input type="password" id="password-input" placeholder="كلمة السر...">
        <button onclick="startChat()">دخول الشات 🚀</button>
    </div>

    <!-- شاشة الشات الرئيسية -->
    <div id="chat-screen">
        <div id="chat-box" onscroll="checkScrollPosition()">
            <button id="load-more-btn" onclick="loadOlderMessages()">⬆️ مشاهدة 20 رسالة قبلها</button>
        </div>
        
        <!-- زر النزول للأسفل -->
        <button id="scroll-down-btn" onclick="scrollToBottom()">⬇️</button>

        <div id="input-box">
            <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        let username = "";
        let oldestMessageId = null;
        let lastMaxId = 0;
        const chatBox = document.getElementById("chat-box");
        const loadMoreBtn = document.getElementById("load-more-btn");
        const scrollDownBtn = document.getElementById("scroll-down-btn");

        async function startChat() {
            const inputUser = document.getElementById("username-input").value.trim();
            const inputPass = document.getElementById("password-input").value.trim();

            if (!inputUser || !inputPass) {
                alert("الرجاء إدخال الاسم وكلمة السر معاً!");
                return;
            }

            try {
                const response = await fetch('https://VigitoSon.pythonanywhere.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: inputUser, password: inputPass })
                });
                
                const data = await response.json();

                if (response.ok) {
                    username = inputUser;
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("chat-screen").style.display = "flex";
                    loadInitialMessages();
                    setInterval(pollNewMessages, 2000);
                } else {
                    alert(data.message || "فشل تسجيل الدخول!");
                }
            } catch (err) {
                alert("حدث خطأ في الاتصال بالسيرفر!");
            }
        }

        async function loadInitialMessages() {
            try {
                const res = await fetch('https://VigitoSon.pythonanywhere.com/api/chat/messages?limit=20');
                const messages = await res.json();
                
                chatBox.innerHTML = '';
                chatBox.appendChild(loadMoreBtn);

                if (messages.length > 0) {
                    oldestMessageId = messages[0].id;
                    lastMaxId = messages[messages.length - 1].id;
                    
                    messages.forEach(msg => appendMessage(msg, false));
                    scrollToBottom();
                }
                
                if (messages.length >= 20) {
                    loadMoreBtn.style.display = "block";
                } else {
                    loadMoreBtn.style.display = "none";
                }
            } catch (err) {
                console.log("خطأ في التحميل:", err);
            }
        }

        async function loadOlderMessages() {
            if (!oldestMessageId) return;
            try {
                const res = await fetch(`https://VigitoSon.pythonanywhere.com/api/chat/messages?limit=20&before_id=${oldestMessageId}`);
                const olderMessages = await res.json();

                if (olderMessages.length > 0) {
                    oldestMessageId = olderMessages[0].id;
                    const prevHeight = chatBox.scrollHeight;

                    olderMessages.reverse().forEach(msg => {
                        const div = document.createElement("div");
                        div.className = "message" + (msg.username === username ? " mine" : "");
                        div.innerHTML = `<div class="user">${msg.username}</div><div class="text">${msg.message}</div>`;
                        loadMoreBtn.after(div);
                    });

                    chatBox.scrollTop = chatBox.scrollHeight - prevHeight;

                    if (olderMessages.length < 20) {
                        loadMoreBtn.style.display = "none";
                    }
                } else {
                    loadMoreBtn.style.display = "none";
                }
            } catch (err) {
                console.log("خطأ في جلب الرسائل القديمة:", err);
            }
        }

        async function pollNewMessages() {
            if (!username) return;
            try {
                const resFetch = await fetch(`https://VigitoSon.pythonanywhere.com/api/chat/messages?limit=10`);
                const messages = await resFetch.json();
                if (messages.length > 0) {
                    const latest = messages[messages.length - 1];
                    if (latest.id > lastMaxId) {
                        messages.forEach(msg => {
                            if (msg.id > lastMaxId) {
                                appendMessage(msg, true);
                                lastMaxId = msg.id;
                            }
                        });
                        if (chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 150) {
                            scrollToBottom();
                        }
                    }
                }
            } catch (err) {
                console.log("خطأ في التحديث:", err);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("message-input");
            const message = inputField.value.trim();
            if (!message) return;

            try {
                await fetch('https://VigitoSon.pythonanywhere.com/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, message: message })
                });
                inputField.value = "";
                pollNewMessages();
                setTimeout(scrollToBottom, 200);
            } catch (err) {
                alert("فشل إرسال الرسالة!");
            }
        }

        function appendMessage(msg, isNew) {
            const div = document.createElement("div");
            div.className = "message" + (msg.username === username ? " mine" : "");
            div.innerHTML = `<div class="user">${msg.username}</div><div class="text">${msg.message}</div>`;
            chatBox.appendChild(div);
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
            scrollDownBtn.style.display = "none";
        }

        function checkScrollPosition() {
            if (chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight > 300) {
                scrollDownBtn.style.display = "flex";
            } else {
                scrollDownBtn.style.display = "none";
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
