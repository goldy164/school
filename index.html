<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - شات أولى إعدادي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-screen">
        <h2>تسجيل الدخول للشات 🚀</h2>
        <input type="text" id="username-input" placeholder="اسم المستخدم...">
        <input type="password" id="password-input" placeholder="كلمة المرور...">
        <button onclick="handleLogin()">دخول المحادثة</button>
    </div>

    <script>
        async function handleLogin() {
            const inputUser = document.getElementById("username-input").value.trim();
            const inputPass = document.getElementById("password-input").value.trim();

            if (!inputUser || !inputPass) {
                alert("الرجاء إدخال اسم المستخدم وكلمة المرور!");
                return;
            }

            try {
                const response = await fetch('https://VigitoSon.pythonanywhere.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: inputUser, password: inputPass })
                });
                
                const data = await response.json();

                if (response.ok) {
                    // حفظ اسم المستخدم في الـ localStorage عشان الصفحة التانية تقراه
                    localStorage.setItem("chat_username", inputUser);
                    // الانتقال لصفحة المحادثة
                    window.location.href = "chat.html";
                } else {
                    alert(data.message || "فشل تسجيل الدخول!");
                }
            } catch (err) {
                alert("حدث خطأ في الاتصال بالسيرفر!");
            }
        }
    </script>
</body>
</html>
