<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة Vigito للتقييم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Server Status Indicator -->
    <div class="top-server-status">
        <div class="status-dot-large" id="statusDot"></div>
        <div class="status-info">
            <span class="status-label">حالة السيرفر</span>
            <span class="status-state" id="statusText">جاري الفحص...</span>
        </div>
    </div>

    <canvas id="bgCanvas"></canvas>

    <div class="card-wrapper">
        <div class="auth-container">
            <div class="brand-header">
                <div class="brand-logo">V</div>
                <h1 class="brand-title">منصة Vigito للتقييم</h1>
                <p class="brand-subtitle">تسجيل الدخول إلى حسابك المدرسي</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">اسم المستخدم أو البريد</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-input" id="loginUsername" placeholder="ادخل اسمك..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                        <button type="button" class="toggle-pwd" onclick="togglePassword('loginPassword', this)">إظهار</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnLoginSubmit">دخول المنصة 🚀</button>
            </form>

            <div class="redirect-link">
                ليس لديك حساب؟ <a href="create_acc/register.html">انشاء حساب جديد</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    // Background Particles
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];

    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    class Particle {
        constructor() {
            this.x = Math.random() * width; this.y = Math.random() * height;
            this.radius = Math.random() * 2 + 1;
            this.vx = (Math.random() - 0.5) * 1; this.vy = (Math.random() - 0.5) * 1;
            this.color = ['#00f2fe', '#6100ff'][Math.floor(Math.random() * 2)];
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color; ctx.fill();
        }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => p.update());
        requestAnimationFrame(animate);
    }
    animate();

    // Server Health Check & API Logic
    const API_URL = 'https://vigito.pythonanywhere.com';

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch(`${API_URL}/`);
            if (res.ok) {
                document.getElementById('statusDot').className = 'status-dot-large online';
                document.getElementById('statusText').className = 'status-state online';
                document.getElementById('statusText').textContent = 'ONLINE';
            } else throw new Error();
        } catch {
            document.getElementById('statusDot').className = 'status-dot-large offline';
            document.getElementById('statusText').className = 'status-state offline';
            document.getElementById('statusText').textContent = 'OFFLINE';
        }
    });

    function togglePassword(id, btn) {
        const input = document.getElementById(id);
        if (input.type === 'password') { input.type = 'text'; btn.textContent = 'إخفاء'; }
        else { input.type = 'password'; btn.textContent = 'إظهار'; }
    }

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg; 
        t.className = `toast ${type}`; 
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 4000);
    }

    // handleLogin
    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btnLoginSubmit');
        btn.disabled = true;
        btn.textContent = 'جاري التحقق...';

        const payload = {
            username: document.getElementById('loginUsername').value.trim(),
            password: document.getElementById('loginPassword').value
        };

        try {
            const response = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showToast(data.message, 'success');
                localStorage.setItem('vigito_user', JSON.stringify(data.user));
                // البقاء في نفس الصفحة أو التثبيت حسب الرغبة
            } else {
                showToast(data.message || 'بيانات الدخول غير صحيحة', 'error');
            }
        } catch (err) {
            showToast('تعذر الاتصال بالسيرفر! يرجى التأكد من السيرفر', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'دخول المنصة 🚀';
        }
    }
</script>
